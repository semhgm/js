<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Not Hesaplama</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Modern bir dokunuş: Arka plan gradyanı ve kart gölgesi */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .my-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .card-header {
            background-color: transparent;
            border-bottom: none;
            font-weight: bold;
            font-size: 1.5rem;
            color: #4a4a4a;
            text-align: center;
            padding-top: 2rem;
        }
        #sonucAlan {
            display: none; /* Başlangıçta gizli */
            transition: all 0.5s ease;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <div class="card my-card mx-auto p-4" style="max-width: 400px;">
            <div class="card-header">
                🎓 Not Hesaplama
            </div>
            <div class="card-body">
                <form id="notForm">
                    <div class="mb-4">
                        <label for="vizeNote" class="form-label fw-semibold">Vize Notu (%40)</label>
                        <input type="number" class="form-control form-control-lg" id="vizeNote" placeholder="Örn: 60" min="0" max="100">
                    </div>
                    
                    <div class="mb-4">
                        <label for="finalNote" class="form-label fw-semibold">Final Notu (%60)</label>
                        <input type="number" class="form-control form-control-lg" id="finalNote" placeholder="Örn: 70" min="0" max="100">
                    </div>

                    <button type="button" class="btn btn-primary btn-lg w-100 shadow-sm" id="btnHesapla">
                        Hesapla
                    </button>
                </form>

                <!-- Sonuç alanı: Alert yerine burada göstermek daha modern durur -->
                <div id="sonucAlan" class="mt-4 alert text-center fw-bold">
                    <!-- JavaScript burayı dolduracak -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scriptlerin -->
    <script src="app.js"></script>
</body>
</html>
